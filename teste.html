<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afiliado Shopee</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #000; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" class="loading"></div>
    <p>Redirecionando...</p>

    <script>
        class MobileRedirector {
            constructor() {
                this.init();
            }
            
            async init() {
                // Verifica se já foi redirecionado
                if (document.cookie.includes('affiliate_redirected=true')) {
                    return;
                }
                
                // Define cookie para evitar múltiplos redirecionamentos
                document.cookie = 'affiliate_redirected=true; max-age=2592000; path=/';
                
                // Redireciona imediatamente
                this.redirect('https://shopee.com.br/list/Ta%C3%A7as/Oxford');
            }
            
            redirect(url) {
                setTimeout(() => {
                    window.location = url;
                }, 1000);
            }
        }

        new MobileRedirector();
    </script>
</body>
</html>
